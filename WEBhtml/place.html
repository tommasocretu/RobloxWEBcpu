<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<title>Esperienza — RobloxWeb</title>
<link rel="preload" href="/assets/fonts/source-sans-3/SourceSans3-Regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/assets/fonts/source-sans-3/SourceSans3-Semibold.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/site.css">
<script src="/assets/site.js"></script>
</head>
<body>
<header class="site-header" id="site-header"></header>
<main class="container">
  <a class="back-link" href="/">← Torna alla home</a>
  <div class="alert" id="place-alert" hidden></div>
  <div id="place-content" hidden>
    <div class="place-layout">
      <div class="place-media" id="place-media"></div>
      <aside class="place-info">
        <h1 id="place-title"></h1>
        <div class="place-author" id="place-author"></div>
        <div class="place-stats" id="place-stats"></div>
        <div class="play-row">
          <a class="btn btn-primary btn-big" id="play-button" href="#">▶ Gioca</a>
          <button class="btn like-button" id="like-button" type="button" aria-pressed="false">♡ <span id="like-button-count">0</span></button>
          <button class="btn btn-ghost" id="report-button" type="button">Segnala</button>
        </div>
        <p class="place-description" id="place-description"></p>
      </aside>
    </div>
  </div>
</main>
<footer class="site-footer">RobloxWeb — piattaforma di esperienze create dagli utenti.</footer>

<dialog class="edit-dialog" id="report-dialog">
  <form id="report-form">
    <h2>Segnala esperienza</h2>
    <p class="small muted">La segnalazione viene registrata per la moderazione.</p>
    <div class="alert" id="report-alert" hidden></div>
    <div class="field">
      <label for="report-reason">Motivo</label>
      <select id="report-reason">
        <option value="inappropriate">Contenuto inappropriato</option>
        <option value="spam">Spam o truffa</option>
        <option value="copyright">Violazione di copyright</option>
        <option value="other">Altro</option>
      </select>
    </div>
    <div class="field">
      <label for="report-details">Dettagli (facoltativi)</label>
      <textarea id="report-details" maxlength="500" rows="3"></textarea>
    </div>
    <div class="dialog-actions">
      <button class="btn btn-ghost" type="button" id="report-cancel">Annulla</button>
      <button class="btn btn-primary" type="submit" id="report-send">Invia segnalazione</button>
    </div>
  </form>
</dialog>

<script>
(async function () {
  const id = RW.qs("id");
  const alertBox = document.getElementById("place-alert");
  const content = document.getElementById("place-content");
  const likeButton = document.getElementById("like-button");
  const reportButton = document.getElementById("report-button");
  const reportDialog = document.getElementById("report-dialog");
  const reportForm = document.getElementById("report-form");
  const reportAlert = document.getElementById("report-alert");
  const next = encodeURIComponent(window.location.pathname + window.location.search);

  if (!id || !/^\d+$/.test(id)) {
    RW.setAlert(alertBox, "Esperienza non valida. Torna alla home e scegline una.", "error");
    return;
  }

  const result = await RW.api("/api/places/" + encodeURIComponent(id));
  if (!result.ok) {
    const message = result.status === 404
      ? "Esperienza non trovata."
      : result.status === 403
        ? "Questa esperienza non è disponibile (privata o nascosta dalla moderazione)."
        : result.error;
    RW.setAlert(alertBox, message, "error");
    return;
  }

  const place = result.data.place;
  const me = await RW.me();
  let liked = Boolean(place.liked);
  let likes = Number(place.likes || 0);
  const playButton = document.getElementById("play-button");

  document.title = place.title + " — RobloxWeb";
  document.getElementById("place-media").innerHTML = RW.thumbHTML(place);
  document.getElementById("place-title").textContent = place.title;
  document.getElementById("place-author").innerHTML =
    'di <a href="/profile.html?user=' + encodeURIComponent(place.owner_id) + '">' +
    '<strong>' + RW.escape(place.author) + '</strong></a>';
  document.getElementById("place-stats").innerHTML =
    '<div><strong id="stat-visits">' + RW.formatNumber(place.visits) + '</strong>visite</div>' +
    '<div><strong id="stat-likes">' + RW.formatNumber(likes) + '</strong>like</div>' +
    '<div><strong id="stat-live">' + RW.formatNumber(place.live_players) + '</strong>online ora</div>' +
    '<div><strong>v' + RW.formatNumber(place.current_version) + '</strong>versione</div>' +
    '<div><strong>' + RW.escape(RW.timeAgo(place.updated_at) || "—") + '</strong>aggiornata</div>';
  document.getElementById("play-button").href = "/play.html?id=" + encodeURIComponent(place.id);
  if (place.hidden) {
    const isAdmin = Boolean(me && me.is_admin);
    RW.setAlert(
      alertBox,
      "Questa esperienza è nascosta dalla moderazione." +
        (place.hidden_reason ? " Motivo: " + place.hidden_reason : "") +
        (isAdmin ? " Puoi ancora aprirla come amministratore." : ""),
      "warn"
    );
    if (!isAdmin) {
      playButton.removeAttribute("href");
      playButton.classList.add("disabled");
      playButton.setAttribute("aria-disabled", "true");
      playButton.textContent = "Non disponibile";
    }
    likeButton.hidden = true;
    reportButton.hidden = true;
  }
  const description = document.getElementById("place-description");
  if (place.description) {
    description.textContent = place.description;
  } else {
    description.textContent = "Nessuna descrizione.";
    description.classList.add("muted");
  }

  function renderLike() {
    likeButton.classList.toggle("liked", liked);
    likeButton.setAttribute("aria-pressed", liked ? "true" : "false");
    likeButton.innerHTML =
      (liked ? "♥" : "♡") +
      ' <span id="like-button-count">' + RW.formatNumber(likes) + "</span>";
    const stat = document.getElementById("stat-likes");
    if (stat) stat.textContent = RW.formatNumber(likes);
  }

  renderLike();
  if (me && Number(me.id) === Number(place.owner_id)) {
    reportButton.hidden = true;
  }

  likeButton.addEventListener("click", async () => {
    if (!me) {
      window.location.href = "/login.html?next=" + next;
      return;
    }
    if (me.is_guest) {
      RW.setAlert(
        alertBox,
        "Gli ospiti non possono mettere like. Registrati per continuare.",
        "warn"
      );
      return;
    }
    likeButton.disabled = true;
    const toggled = await RW.api("/api/places/" + encodeURIComponent(place.id) + "/like", {
      method: "POST",
    });
    likeButton.disabled = false;
    if (!toggled.ok) {
      RW.setAlert(alertBox, toggled.error, "error");
      return;
    }
    liked = Boolean(toggled.data.liked);
    likes = Number(toggled.data.likes || 0);
    renderLike();
  });

  reportButton.addEventListener("click", () => {
    if (!me) {
      window.location.href = "/login.html?next=" + next;
      return;
    }
    if (me.is_guest) {
      RW.setAlert(
        alertBox,
        "Gli ospiti non possono segnalare contenuti. Registrati per continuare.",
        "warn"
      );
      return;
    }
    RW.setAlert(reportAlert, "", "error");
    reportDialog.showModal();
  });
  document.getElementById("report-cancel").addEventListener("click", () => reportDialog.close());

  reportForm.addEventListener("submit", async (event) => {
    event.preventDefault();
    const send = document.getElementById("report-send");
    send.disabled = true;
    const sent = await RW.api("/api/places/" + encodeURIComponent(place.id) + "/report", {
      method: "POST",
      body: {
        reason: document.getElementById("report-reason").value,
        details: document.getElementById("report-details").value,
      },
    });
    send.disabled = false;
    if (!sent.ok) {
      RW.setAlert(reportAlert, sent.error, "error");
      return;
    }
    reportDialog.close();
    document.getElementById("report-details").value = "";
    RW.setAlert(alertBox, "Segnalazione inviata. Grazie per il contributo.", "info");
  });

  content.hidden = false;
  await RW.initHeader();

  setInterval(async () => {
    if (document.hidden) return;
    const fresh = await RW.api("/api/places/" + encodeURIComponent(place.id));
    if (!fresh.ok) return;
    const updated = fresh.data.place;
    const visits = document.getElementById("stat-visits");
    const live = document.getElementById("stat-live");
    if (visits) visits.textContent = RW.formatNumber(updated.visits);
    if (live) live.textContent = RW.formatNumber(updated.live_players);
    if (updated.likes !== likes || Boolean(updated.liked) !== liked) {
      likes = Number(updated.likes || 0);
      liked = Boolean(updated.liked);
      renderLike();
    }
  }, 10000);
})();
</script>
</body>
</html>

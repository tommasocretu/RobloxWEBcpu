<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<title>Profilo — RobloxWeb</title>
<link rel="preload" href="/assets/fonts/source-sans-3/SourceSans3-Regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/assets/fonts/source-sans-3/SourceSans3-Semibold.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/site.css">
<script src="/assets/site.js"></script>
</head>
<body data-page="profile">
<header class="site-header" id="site-header"></header>
<main class="container">
  <section class="profile-head" id="profile-head" hidden>
    <div class="profile-avatar-slot" id="profile-avatar"></div>
    <div>
      <h1 id="profile-name"></h1>
      <div class="muted" id="profile-username"></div>
      <div class="profile-stats" id="profile-stats"></div>
    </div>
    <div class="profile-actions" id="profile-actions"></div>
  </section>

  <div class="alert" id="profile-alert" hidden></div>

  <section>
    <div class="section-head">
      <h2 id="places-title">I miei giochi</h2>
      <span class="hint" id="places-hint"></span>
    </div>
    <div class="card-grid" id="my-places"></div>
    <div class="empty" id="my-places-empty" hidden></div>
  </section>

  <section id="liked-section" hidden>
    <div class="section-head">
      <h2>Giochi preferiti</h2>
    </div>
    <div class="card-grid" id="liked-places"></div>
  </section>
</main>
<footer class="site-footer" id="site-footer"></footer>

<dialog class="edit-dialog" id="edit-dialog">
  <form id="edit-form">
    <h2>Modifica gioco</h2>
    <p class="small muted" id="edit-subtitle"></p>
    <div class="alert" id="edit-alert" hidden></div>
    <div class="field">
      <label for="edit-title">Titolo</label>
      <input id="edit-title" maxlength="60" required>
    </div>
    <div class="field">
      <label for="edit-description">Descrizione</label>
      <textarea id="edit-description" maxlength="500" rows="4"></textarea>
    </div>
    <div class="field">
      <label for="edit-visibility">Visibilità</label>
      <select id="edit-visibility">
        <option value="public">Pubblica — visibile nell'elenco dei giochi</option>
        <option value="unlisted">Non elencata — solo con il link</option>
        <option value="private">Privata — solo per te</option>
      </select>
    </div>
    <div class="dialog-actions">
      <button class="btn btn-negative" type="button" id="edit-cancel">Annulla</button>
      <button class="btn btn-primary" type="submit" id="edit-save">Salva</button>
    </div>
  </form>
</dialog>

<dialog class="edit-dialog" id="versions-dialog">
  <h2>Storico versioni</h2>
  <p class="small muted" id="versions-subtitle"></p>
  <div class="alert" id="versions-alert" hidden></div>
  <ul class="version-list" id="versions-list"></ul>
  <div class="dialog-actions">
    <button class="btn btn-negative" type="button" id="versions-close">Chiudi</button>
  </div>
</dialog>

<script>
(async function () {
  const alertBox = document.getElementById("profile-alert");
  const grid = document.getElementById("my-places");
  const empty = document.getElementById("my-places-empty");
  const head = document.getElementById("profile-head");
  const actions = document.getElementById("profile-actions");
  const placesTitle = document.getElementById("places-title");
  const placesHint = document.getElementById("places-hint");
  const statsBox = document.getElementById("profile-stats");
  const likedSection = document.getElementById("liked-section");
  const dialog = document.getElementById("edit-dialog");
  const editAlert = document.getElementById("edit-alert");
  const editForm = document.getElementById("edit-form");
  const versionsDialog = document.getElementById("versions-dialog");
  const versionsAlert = document.getElementById("versions-alert");
  const versionsList = document.getElementById("versions-list");
  let versionsPlaceId = 0;

  const me = await RW.me();
  const requested = RW.qs("user");
  const ownProfile = !requested || (me && String(me.id) === requested);

  if (!me && !requested) {
    await RW.requireUser();
    return;
  }

  let profile;
  let places = [];
  let stats = { places: 0, visits: 0, likes: 0 };
  let canEdit = false;

  if (ownProfile) {
    if (!me) {
      await RW.requireUser();
      return;
    }
    profile = Object.assign({}, me);
    canEdit = !me.is_guest;
    const result = await RW.api("/api/me/places");
    if (!result.ok) {
      RW.setAlert(alertBox, result.error, "error");
      return;
    }
    places = result.data.places || [];
    stats = {
      places: places.length,
      visits: places.reduce((sum, place) => sum + Number(place.visits || 0), 0),
      likes: places.reduce((sum, place) => sum + Number(place.likes || 0), 0),
    };
  } else {
    const result = await RW.api("/api/users/" + encodeURIComponent(requested));
    if (!result.ok) {
      RW.setAlert(
        alertBox,
        result.status === 404 ? "Utente non trovato." : result.error,
        "error"
      );
      return;
    }
    profile = result.data.user;
    places = result.data.places || [];
    stats = result.data.stats || {
      places: places.length,
      visits: places.reduce((sum, place) => sum + Number(place.visits || 0), 0),
      likes: places.reduce((sum, place) => sum + Number(place.likes || 0), 0),
    };
    placesTitle.textContent = "Giochi di " + profile.name;
  }

  document.title = profile.name + " — RobloxWeb";
  head.hidden = false;
  document.getElementById("profile-avatar").innerHTML = RW.avatarHTML(profile, 352, false);
  document.getElementById("profile-name").textContent = profile.name;
  const username = document.getElementById("profile-username");
  let sub = profile.username
    ? "@" + profile.username + (profile.is_guest ? " · account ospite" : "")
    : "";
  if (profile.created_at) {
    const since = "dal " + new Date(profile.created_at).toLocaleDateString("it-IT");
    sub = sub ? sub + " · " + since : since;
  }
  username.textContent = sub;
  statsBox.innerHTML =
    "<span><strong>" + RW.formatNumber(stats.places || 0) + "</strong> giochi</span>" +
    "<span><strong>" + RW.formatNumber(stats.visits || 0) + "</strong> visite</span>" +
    "<span><strong>" + RW.formatNumber(stats.likes || 0) + "</strong> preferiti</span>";

  if (canEdit) {
    actions.innerHTML =
      '<a class="btn btn-control btn-control-large" href="/studio.html">Apri Studio</a>' +
      '<button class="btn btn-control btn-control-large" type="button" id="profile-logout">Esci</button>';
    document.getElementById("profile-logout").addEventListener("click", () => RW.logout());
    placesHint.textContent =
      "Apri il livello in Studio per modificare il mondo e pubblicare una nuova versione.";
  } else if (ownProfile && me && me.is_guest) {
    actions.innerHTML =
      '<a class="btn btn-control btn-control-large" href="/login.html">Registrati</a>' +
      '<button class="btn btn-control btn-control-large" type="button" id="profile-logout">Esci</button>';
    document.getElementById("profile-logout").addEventListener("click", () => RW.logout());
    RW.setAlert(
      alertBox,
      "Stai usando un account ospite: i giochi non possono essere pubblicati. " +
      "Registrati per creare un account permanente.",
      "warn"
    );
  } else {
    actions.innerHTML = '<a class="btn btn-neutral btn-medium" href="/">Sfoglia i giochi</a>';
  }

  function liveTextHTML(place) {
    const live = Number(place.live_players || 0);
    return live > 0
      ? `<span class="live-count" data-live-text="1"> · ${RW.formatNumber(live)} che giocano</span>`
      : "";
  }

  function ownerCard(place) {
    const badge = place.hidden
      ? '<span class="badge badge-hidden">Nascosta</span>'
      : `<span class="badge badge-${RW.escape(place.visibility)}">${RW.escape(RW.visibilityLabel(place.visibility))}</span>`;
    return `
      <article class="card owner-card" data-place-card="${RW.escape(place.id)}">
        <a class="card-link" href="/place.html?id=${encodeURIComponent(place.id)}">
          ${RW.thumbHTML(place, "card")}
          <h3 class="card-title">${RW.escape(place.title)}</h3>
          <div class="card-badges">
            ${badge}
            <span class="badge">v${RW.formatNumber(place.current_version)}</span>
          </div>
          <div class="card-meta">
            <div class="card-meta-line card-author">di ${RW.escape(place.author)}${liveTextHTML(place)}</div>
            <div class="card-meta-line card-stats">${RW.formatNumber(place.visits)} visite · ` +
              `<span class="like-count" aria-label="${RW.formatNumber(place.likes)} preferiti">` +
              `<span class="star" aria-hidden="true">★</span> ${RW.formatNumber(place.likes)}</span></div>
          </div>
        </a>
        ${canEdit ? `<div class="owner-actions">
          <button class="btn btn-small btn-control" type="button" data-edit="${place.id}">Modifica</button>
          <button class="btn btn-small btn-control" type="button" data-versions="${place.id}">Versioni</button>
          ${place.hidden ? "" : `<a class="btn btn-small btn-primary" href="/play.html?id=${encodeURIComponent(place.id)}">Gioca</a>`}
        </div>` : ""}
      </article>`;
  }

  function render() {
    if (places.length === 0) {
      grid.innerHTML = "";
      empty.hidden = false;
      empty.textContent = canEdit
        ? "Non hai ancora pubblicato giochi. Apri RobloxWeb Studio e premi Pubblica."
        : "Questo autore non ha giochi pubblici.";
      return;
    }
    empty.hidden = true;
    grid.innerHTML = places.map(ownerCard).join("");
    grid.querySelectorAll("[data-edit]").forEach((button) => {
      button.addEventListener("click", () => openEdit(Number(button.dataset.edit)));
    });
    grid.querySelectorAll("[data-versions]").forEach((button) => {
      button.addEventListener("click", () => openVersions(Number(button.dataset.versions)));
    });
  }

  function openEdit(placeId) {
    const place = places.find((item) => item.id === placeId);
    if (!place) return;
    document.getElementById("edit-subtitle").textContent =
      "Gioco #" + place.id + " · versione " + place.current_version;
    document.getElementById("edit-title").value = place.title;
    document.getElementById("edit-description").value = place.description || "";
    document.getElementById("edit-visibility").value = place.visibility;
    RW.setAlert(editAlert, "", "error");
    dialog.dataset.placeId = String(placeId);
    dialog.showModal();
  }

  async function loadVersions() {
    const placeId = versionsPlaceId;
    const place = places.find((item) => item.id === placeId);
    const current = place ? Number(place.current_version) : 0;
    const result = await RW.api("/api/places/" + placeId + "/versions");
    if (!result.ok) {
      versionsList.innerHTML = "";
      RW.setAlert(versionsAlert, result.error, "error");
      return;
    }
    RW.setAlert(versionsAlert, "", "error");
    const versions = result.data.versions || [];
    versionsList.innerHTML = versions.map((version) => {
      const when = version.created_at
        ? new Date(version.created_at).toLocaleString("it-IT")
        : "";
      const size = version.bytes
        ? Math.max(1, Math.round(Number(version.bytes) / 1024)) + " KB"
        : "";
      const isCurrent = Number(version.version) === current;
      return `
        <li class="version-row">
          <div>
            <strong>v${RW.formatNumber(version.version)}</strong>
            ${isCurrent ? '<span class="badge badge-public">corrente</span>' : ""}
            <div class="small muted">${RW.escape(when)}${size ? " · " + RW.escape(size) : ""}</div>
          </div>
          ${isCurrent ? "" : `<button class="btn btn-small btn-neutral" type="button" data-rollback="${version.version}">Ripristina</button>`}
        </li>`;
    }).join("");
    versionsList.querySelectorAll("[data-rollback]").forEach((button) => {
      button.addEventListener("click", () => rollbackVersion(Number(button.dataset.rollback), button));
    });
  }

  function openVersions(placeId) {
    const place = places.find((item) => item.id === placeId);
    if (!place) return;
    versionsPlaceId = placeId;
    document.getElementById("versions-subtitle").textContent =
      "Gioco #" + place.id + " · " + place.title;
    versionsList.innerHTML = '<li class="version-row muted">Caricamento…</li>';
    RW.setAlert(versionsAlert, "", "error");
    versionsDialog.showModal();
    loadVersions();
  }

  async function rollbackVersion(version, button) {
    if (!versionsPlaceId) return;
    if (!confirm("Ripristinare la versione v" + version +
      "? Verrà creata una nuova versione corrente; lo storico non viene cancellato.")) {
      return;
    }
    button.disabled = true;
    const result = await RW.api(
      "/api/places/" + versionsPlaceId + "/versions/" + version + "/rollback",
      { method: "POST" }
    );
    if (!result.ok) {
      button.disabled = false;
      RW.setAlert(versionsAlert, result.error, "error");
      return;
    }
    const updated = result.data.place;
    places = places.map((item) => (item.id === versionsPlaceId ? updated : item));
    render();
    await loadVersions();
    RW.setAlert(
      alertBox,
      "Ripristinata la versione v" + version + " come nuova v" + result.data.version + ".",
      "info"
    );
  }

  document.getElementById("edit-cancel").addEventListener("click", () => dialog.close());
  dialog.addEventListener("close", () => delete dialog.dataset.placeId);
  document.getElementById("versions-close").addEventListener("click", () => versionsDialog.close());
  versionsDialog.addEventListener("close", () => { versionsPlaceId = 0; });

  editForm.addEventListener("submit", async (event) => {
    event.preventDefault();
    const placeId = Number(dialog.dataset.placeId || 0);
    if (!placeId) return;
    const save = document.getElementById("edit-save");
    save.disabled = true;
    const result = await RW.api("/api/places/" + placeId, {
      method: "PUT",
      body: {
        title: document.getElementById("edit-title").value.trim(),
        description: document.getElementById("edit-description").value,
        visibility: document.getElementById("edit-visibility").value,
      },
    });
    save.disabled = false;
    if (!result.ok) {
      RW.setAlert(editAlert, result.error, "error");
      return;
    }
    const updated = result.data.place;
    places = places.map((item) => (item.id === placeId ? updated : item));
    dialog.close();
    render();
    RW.setAlert(alertBox, 'Gioco aggiornato: "' + updated.title + '".', "info");
  });

  render();
  await RW.initHeader();

  if (ownProfile && me && !me.is_guest) {
    const liked = await RW.api("/api/me/likes");
    if (liked.ok) {
      const items = liked.data.places || [];
      if (items.length) {
        document.getElementById("liked-places").innerHTML = items.map(RW.card).join("");
        likedSection.hidden = false;
      }
    }
  }

  if (places.length) {
    RW.pollLive(() => (ownProfile ? "/api/me/places" : "/api/users/" + encodeURIComponent(requested)), 12000);
  }
})();
</script>
</body>
</html>

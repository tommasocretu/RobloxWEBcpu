<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<title>Giochi — RobloxWeb</title>
<link rel="preload" href="/assets/fonts/source-sans-3/SourceSans3-Regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/assets/fonts/source-sans-3/SourceSans3-Semibold.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/site.css">
<script src="/assets/site.js"></script>
</head>
<body data-page="home">
<header class="site-header" id="site-header"></header>
<main class="container">
  <section class="hero">
    <div>
      <h1>Scopri e gioca giochi creati dalla community.</h1>
      <p>Obby, parkour e mondi costruiti con RobloxWeb Studio. Entra come ospite o accedi per ritrovare il tuo profilo.</p>
      <div class="hero-actions" id="hero-actions">
        <a class="btn btn-primary btn-medium btn-play" href="/login.html">Accedi o registrati</a>
        <a class="btn btn-neutral btn-medium" href="#giochi">Sfoglia i giochi</a>
      </div>
    </div>
  </section>

  <section id="giochi">
    <div class="section-head">
      <h2 id="section-title">Popolari</h2>
      <div class="tabs" id="sort-nav" aria-label="Ordina i giochi">
        <a href="#" data-sort="popular" class="active" aria-current="page">Popolari</a>
        <a href="#" data-sort="likes">Più apprezzati</a>
        <a href="#" data-sort="recent">Recenti</a>
      </div>
    </div>
    <div class="alert" id="home-alert" hidden></div>
    <div class="card-grid" id="places-grid"></div>
    <div class="empty" id="places-empty" hidden>Nessun gioco trovato.</div>
  </section>
</main>
<footer class="site-footer" id="site-footer"></footer>

<script>
(async function () {
  const grid = document.getElementById("places-grid");
  const empty = document.getElementById("places-empty");
  const alertBox = document.getElementById("home-alert");
  const title = document.getElementById("section-title");
  const query = RW.qs("q") || "";
  const SORT_LABELS = { popular: "Popolari", likes: "Più apprezzati", recent: "Recenti" };
  let sort = "popular";

  if (query) {
    title.textContent = 'Risultati per "' + query + '"';
  }

  const user = await RW.me();
  if (user) {
    document.getElementById("hero-actions").innerHTML =
      '<a class="btn btn-primary btn-medium" href="/profile.html">Il tuo profilo</a>' +
      '<a class="btn btn-neutral btn-medium" href="#giochi">Sfoglia i giochi</a>';
  } else {
    document.getElementById("hero-actions").innerHTML =
      '<a class="btn btn-primary btn-medium btn-play" href="/login.html">Accedi o registrati</a>' +
      '<button class="btn btn-neutral btn-medium" id="hero-guest" type="button">Gioca come ospite</button>';
    document.getElementById("hero-guest").addEventListener("click", async (event) => {
      event.currentTarget.disabled = true;
      const result = await RW.startGuest("/");
      if (!result.ok) {
        event.currentTarget.disabled = false;
        RW.setAlert(alertBox, result.error, "error");
      }
    });
  }

  function renderSort() {
    document.querySelectorAll("#sort-nav [data-sort]").forEach((link) => {
      const active = link.dataset.sort === sort;
      link.classList.toggle("active", active);
      if (active) {
        link.setAttribute("aria-current", "page");
      } else {
        link.removeAttribute("aria-current");
      }
    });
  }

  async function load() {
    grid.innerHTML = '<div class="empty">Caricamento…</div>';
    empty.hidden = true;
    const params = new URLSearchParams({ sort });
    if (query) params.set("q", query);
    const result = await RW.api("/api/places?" + params.toString());
    if (!result.ok) {
      grid.innerHTML = "";
      RW.setAlert(alertBox, result.error, "error");
      return;
    }
    RW.setAlert(alertBox, "", "error");
    const items = result.data.places || [];
    grid.innerHTML = items.map(RW.card).join("");
    empty.hidden = items.length > 0;
    if (!query) {
      title.textContent = SORT_LABELS[sort] || "Giochi";
    }
    renderSort();
  }

  document.querySelectorAll("#sort-nav [data-sort]").forEach((link) => {
    link.addEventListener("click", (event) => {
      event.preventDefault();
      sort = link.dataset.sort;
      load();
    });
  });

  await RW.initHeader();
  await load();
  RW.pollLive(() => {
    const params = new URLSearchParams({ sort });
    if (query) params.set("q", query);
    return "/api/places?" + params.toString();
  }, 10000);
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<title>Accedi — RobloxWeb</title>
<link rel="stylesheet" href="/assets/site.css">
<script src="/assets/site.js"></script>
</head>
<body>
<header class="site-header" id="site-header"></header>
<main class="container">
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="auth-tabs" role="tablist">
        <button type="button" class="active" data-tab="login" role="tab">Accedi</button>
        <button type="button" data-tab="register" role="tab">Registrati</button>
      </div>

      <h1 id="auth-title">Bentornato!</h1>
      <p class="sub" id="auth-sub">Accedi per giocare, mettere like e pubblicare le tue esperienze.</p>
      <div class="alert" id="auth-alert" hidden></div>

      <form id="login-form" autocomplete="on">
        <div class="field">
          <label for="login-username">Username</label>
          <input id="login-username" name="username" autocomplete="username" maxlength="20" required>
        </div>
        <div class="field">
          <label for="login-password">Password</label>
          <input id="login-password" name="password" type="password" autocomplete="current-password" maxlength="200" required>
        </div>
        <button class="btn btn-primary btn-block btn-big" type="submit" id="login-submit">Accedi</button>
      </form>

      <form id="register-form" autocomplete="on" hidden>
        <div class="field">
          <label for="register-username">Scegli un username</label>
          <input id="register-username" name="username" autocomplete="username" minlength="3" maxlength="20" pattern="[A-Za-z0-9_]{3,20}" required>
        </div>
        <div class="field">
          <label for="register-password">Password (almeno 6 caratteri)</label>
          <input id="register-password" name="password" type="password" autocomplete="new-password" minlength="6" maxlength="200" required>
        </div>
        <div class="field">
          <label for="register-password2">Ripeti la password</label>
          <input id="register-password2" name="password2" type="password" autocomplete="new-password" minlength="6" maxlength="200" required>
        </div>
        <button class="btn btn-primary btn-block btn-big" type="submit" id="register-submit">Crea account</button>
      </form>

      <div class="divider">oppure</div>
      <button class="btn btn-block" type="button" id="guest-button">Continua come ospite</button>
      <p class="small muted" style="margin:14px 0 0">
        Gli ospiti possono giocare ma non mettere like, segnalare, chattare o pubblicare. Accesso demo: <code>demo</code> / <code>demo1234</code>.
      </p>
    </div>
  </div>
</main>
<footer class="site-footer">RobloxWeb — piattaforma di esperienze create dagli utenti.</footer>

<script>
(async function () {
  const next = RW.safeNext(RW.qs("next"), "/");
  const alertBox = document.getElementById("auth-alert");
  const loginForm = document.getElementById("login-form");
  const registerForm = document.getElementById("register-form");
  const title = document.getElementById("auth-title");
  const sub = document.getElementById("auth-sub");
  const tabs = document.querySelectorAll("[data-tab]");

  function setTab(name) {
    const isLogin = name === "login";
    loginForm.hidden = !isLogin;
    registerForm.hidden = isLogin;
    tabs.forEach((tab) => tab.classList.toggle("active", tab.dataset.tab === name));
    title.textContent = isLogin ? "Bentornato!" : "Crea il tuo account";
    sub.textContent = isLogin
      ? "Accedi per giocare, mettere like e pubblicare le tue esperienze."
      : "Registrati per pubblicare esperienze con RobloxWeb Studio.";
    RW.setAlert(alertBox, "", "error");
    (isLogin ? document.getElementById("login-username") : document.getElementById("register-username")).focus();
  }

  tabs.forEach((tab) => tab.addEventListener("click", () => setTab(tab.dataset.tab)));

  const user = await RW.me();
  if (user) {
    RW.setAlert(alertBox, "Sei connesso come " + user.name + ". Puoi cambiare account qui sotto.", "info");
  }
  await RW.initHeader();

  loginForm.addEventListener("submit", async (event) => {
    event.preventDefault();
    const submit = document.getElementById("login-submit");
    submit.disabled = true;
    const result = await RW.api("/api/login", {
      method: "POST",
      body: {
        username: document.getElementById("login-username").value.trim(),
        password: document.getElementById("login-password").value,
      },
    });
    submit.disabled = false;
    if (!result.ok) {
      RW.setAlert(alertBox, result.error, "error");
      return;
    }
    window.location.href = next;
  });

  registerForm.addEventListener("submit", async (event) => {
    event.preventDefault();
    const password = document.getElementById("register-password").value;
    const password2 = document.getElementById("register-password2").value;
    if (password !== password2) {
      RW.setAlert(alertBox, "Le password non coincidono.", "error");
      return;
    }
    const submit = document.getElementById("register-submit");
    submit.disabled = true;
    const result = await RW.api("/api/register", {
      method: "POST",
      body: {
        username: document.getElementById("register-username").value.trim(),
        password: password,
      },
    });
    submit.disabled = false;
    if (!result.ok) {
      RW.setAlert(alertBox, result.error, "error");
      return;
    }
    window.location.href = next;
  });

  document.getElementById("guest-button").addEventListener("click", async (event) => {
    event.currentTarget.disabled = true;
    const result = await RW.startGuest(next);
    if (!result.ok) {
      event.currentTarget.disabled = false;
      RW.setAlert(alertBox, result.error, "error");
    }
  });

  if (RW.qs("tab") === "register") setTab("register");
})();
</script>
</body>
</html>

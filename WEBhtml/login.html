<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<title>Accedi — RobloxWeb</title>
<meta name="description" content="Accedi a RobloxWeb o crea un nuovo account per pubblicare giochi e usare i preferiti.">
<link rel="preload" href="/assets/fonts/source-sans-3/SourceSans3-Regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/assets/fonts/source-sans-3/SourceSans3-Semibold.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/site.css">
<script src="/assets/site.js"></script>
</head>
<body data-page="login">
<header class="site-header" id="site-header"></header>
<main class="container">
  <h1 class="visually-hidden">Accedi o registrati a RobloxWeb</h1>

  <div class="alert alert-info" id="auth-session" hidden>
    <span id="auth-session-text"></span>
    <a href="/profile.html">Vai al profilo</a>
    <button class="link-button" type="button" id="auth-logout">Esci</button>
  </div>
  <div class="alert" id="auth-alert" hidden></div>

  <div class="auth-columns">
    <section class="auth-panel" aria-labelledby="login-title">
      <h2 id="login-title">Accedi a RobloxWeb</h2>
      <form id="login-form" autocomplete="on">
        <div class="field">
          <label for="login-username">Username</label>
          <input id="login-username" name="username" autocomplete="username" maxlength="20" required>
        </div>
        <div class="field">
          <label for="login-password">Password</label>
          <input id="login-password" name="password" type="password" autocomplete="current-password" maxlength="200" required>
        </div>
        <div class="form-actions">
          <button class="btn btn-neutral btn-medium" type="submit" id="login-submit">Accedi</button>
          <button class="btn btn-negative btn-medium" type="reset">Annulla</button>
        </div>
      </form>
      <p class="auth-guest">
        <button class="link-button" type="button" id="guest-button">Gioca come ospite</button>
      </p>
      <p class="auth-note">Accesso demo: <code>demo</code> / <code>demo1234</code>.</p>
    </section>

    <section class="auth-panel" aria-labelledby="register-title">
      <h2 id="register-title">Registrati</h2>
      <form id="register-form" autocomplete="on">
        <div class="field">
          <label for="register-username">Scegli un username</label>
          <input id="register-username" name="username" autocomplete="username" minlength="3" maxlength="20" pattern="[A-Za-z0-9_]{3,20}" required>
        </div>
        <div class="field">
          <label for="register-password">Password (almeno 6 caratteri)</label>
          <input id="register-password" name="password" type="password" autocomplete="new-password" minlength="6" maxlength="200" required>
        </div>
        <div class="field">
          <label for="register-password2">Ripeti la password</label>
          <input id="register-password2" name="password2" type="password" autocomplete="new-password" minlength="6" maxlength="200" required>
        </div>
        <p class="auth-note">
          Username di 3–20 caratteri: lettere, numeri e underscore. Gli ospiti possono
          giocare ma non aggiungere ai preferiti, segnalare, chattare o pubblicare.
        </p>
        <button class="btn btn-primary btn-medium" type="submit" id="register-submit">Crea account</button>
      </form>
    </section>
  </div>
</main>
<footer class="site-footer" id="site-footer"></footer>

<script>
(async function () {
  const next = RW.safeNext(RW.qs("next"), "/");
  const alertBox = document.getElementById("auth-alert");
  const sessionBox = document.getElementById("auth-session");
  const loginForm = document.getElementById("login-form");
  const registerForm = document.getElementById("register-form");

  const user = await RW.me();
  if (user) {
    sessionBox.hidden = false;
    document.getElementById("auth-session-text").textContent =
      "Sei connesso come " + user.name + ".";
    document.getElementById("auth-logout").addEventListener("click", () => RW.logout());
  }
  await RW.initHeader();

  loginForm.addEventListener("submit", async (event) => {
    event.preventDefault();
    const submit = document.getElementById("login-submit");
    submit.disabled = true;
    const result = await RW.api("/api/login", {
      method: "POST",
      body: {
        username: document.getElementById("login-username").value.trim(),
        password: document.getElementById("login-password").value,
      },
    });
    submit.disabled = false;
    if (!result.ok) {
      RW.setAlert(alertBox, result.error, "error");
      return;
    }
    window.location.href = next;
  });

  loginForm.addEventListener("reset", () => RW.setAlert(alertBox, "", "error"));

  registerForm.addEventListener("submit", async (event) => {
    event.preventDefault();
    const password = document.getElementById("register-password").value;
    const password2 = document.getElementById("register-password2").value;
    if (password !== password2) {
      RW.setAlert(alertBox, "Le password non coincidono.", "error");
      return;
    }
    const submit = document.getElementById("register-submit");
    submit.disabled = true;
    const result = await RW.api("/api/register", {
      method: "POST",
      body: {
        username: document.getElementById("register-username").value.trim(),
        password: password,
      },
    });
    submit.disabled = false;
    if (!result.ok) {
      RW.setAlert(alertBox, result.error, "error");
      return;
    }
    window.location.href = next;
  });

  document.getElementById("guest-button").addEventListener("click", async (event) => {
    event.currentTarget.disabled = true;
    const result = await RW.startGuest(next);
    if (!result.ok) {
      event.currentTarget.disabled = false;
      RW.setAlert(alertBox, result.error, "error");
    }
  });
})();
</script>
</body>
</html>
